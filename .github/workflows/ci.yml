name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
      - name: Tests, lint, and debug build
        run: ./gradlew :tool:check :tool:assembleDebug --console=plain
      - name: Validate Light's source extraction and unsigned release build
        run: ./scripts/verify-submission.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-review
          path: |
            tool/build/reports/
            build/submission-check/
